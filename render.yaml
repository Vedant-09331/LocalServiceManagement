services:
  - type: web
    name: localservicemanagement
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd LocalServiceManagement && gunicorn LocalServiceManagement.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false # Set this manually in the Render Dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
